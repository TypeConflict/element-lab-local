<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="你的本機元素合成實驗室"><title>元素實驗室</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23271e14'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='30' fill='%23e8b851'%3E✦%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<header class="workbench"><div class="formula"><button class="slot" id="slot0" aria-label="第一個材料">點選材料</button><span class="plus" aria-hidden="true">＋</span><button class="slot" id="slot1" aria-label="第二個材料">點選材料</button><button id="clear" class="round" aria-label="清空材料" title="清空材料">↶</button></div><div class="bench-info"><span>✦ 元素實驗室 <span class="divider">/</span> <span id="modeLabel">經典配方</span></span><span id="operationHint">選兩個材料，按 ＋ 合成 · 材料不會消耗</span><button id="settings">⚙ 模型設定</button></div></header>
<main><div class="toolbar"><button id="sort" title="切換最新發現與名稱排序">↕ <span>最新</span></button><button id="favorites" aria-pressed="false">★ 收藏 <small id="favoriteCount">0</small></button><button id="dictionaryButton">📖 字典</button><div class="search cabinet-search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="全櫃搜尋造物名稱…" aria-label="全櫃搜尋造物名稱"><button id="clearSearch" type="button" aria-label="清空全櫃搜尋" title="清空搜尋（Esc）" hidden>×</button></div><button id="historyButton" class="round" title="操作紀錄" aria-label="操作紀錄">◷</button></div>
<div class="library"><nav id="categories" aria-label="元素分類"></nav><section class="collection"><div class="collection-meta"><span id="viewLabel">全部造物</span><span id="visibleCount" role="status"></span></div><div id="elements" class="elements" aria-label="元素清單"></div></section></div></main>
<footer><div class="action-dock" role="group" aria-label="材料操作"><span id="actionHint" role="status">放入材料以開始</span><div class="action-buttons"><button id="extract" disabled>◈ 萃取</button><button id="combine" disabled>＋ 合成</button></div></div><div class="save-bar"><span id="storageStatus" role="status">正在讀取本機資料庫…</span><button id="retry" hidden>重試儲存</button><span><b id="count">4</b> 個造物 <span class="divider">/</span> <b id="discoveryCount">0</b> 個新發現</span></div></footer>
<dialog id="resultDialog" aria-labelledby="resultTitle" aria-describedby="resultDescription resultDismissHint"><button id="closeResult" type="button" aria-label="關閉結果" autofocus>×</button><div id="result" class="result"></div><p id="resultDismissHint">點任意位置或按 Esc 關閉</p></dialog><dialog id="dialog"><form id="settingsForm"><div class="dialog-head"><h2>模型設定</h2><button type="button" id="close" aria-label="關閉">×</button></div><label>生成模式<select id="mode"><option value="classic">經典配方 · 立即遊玩</option><option value="llm">LLM · 自由聯想</option></select></label><p>經典模式使用內建配方。LLM 模式將兩個元素交給你設定的模型服務。</p><label>合成服務網址<input id="endpoint" type="text" placeholder="留白使用本機模型服務"></label><label>萃取服務網址<input id="extractEndpoint" type="text" placeholder="留白使用本機萃取服務"></label><small>模型 API 金鑰請放在本機 .env，不要貼在網址中。已成功合成的配方會保存，下次可直接取用。</small><p id="settingsError" role="alert"></p><button class="primary" type="submit">儲存設定</button></form></dialog>
<dialog id="historyDialog"><div class="dialog-head"><h2>操作紀錄 <small id="recordCount">0</small></h2><button id="closeHistory" aria-label="關閉紀錄">×</button></div><p class="muted">顯示最近 200 筆，完整紀錄保留在本機資料庫。</p><div id="history"></div></dialog><dialog id="dictionaryDialog" aria-labelledby="dictionaryTitle"><div class="dialog-head"><h2 id="dictionaryTitle">造物字典</h2><button id="closeDictionary" aria-label="關閉字典">×</button></div><p class="muted">查看已發現的造物與抽象概念，以及合成或萃取來源。</p><label class="search dictionary-search"><span>⌕</span><input id="dictionarySearch" placeholder="搜尋已發現的造物…" aria-label="搜尋字典"></label><div class="dictionary-layout"><div id="dictionaryList" aria-label="字典造物清單"></div><section id="dictionaryDetail" aria-live="polite"></section></div></dialog><script type="module" src="app.js"></script></body></html>
